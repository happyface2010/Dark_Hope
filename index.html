<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL: ZONE-53</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #d1d1d1;
            --accent-color: #f48024;
            --error-color: #ff3030;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 1000;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        @keyframes alarm-pulse {
            0% { background-color: #050505; }
            50% { background-color: #2a0000; }
            100% { background-color: #050505; }
        }

        .alarm-active { animation: alarm-pulse 1s infinite; }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            20% { transform: translate(-2px, -2px); }
            40% { transform: translate(3px, -1px); }
            60% { transform: translate(-3px, 2px); }
            80% { transform: translate(1px, -2px); }
            100% { transform: translate(-1px, 1px); }
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 40px;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            border-left: 1px solid #222;
            border-right: 1px solid #222;
            min-height: 100vh;
        }

        .glitch { color: var(--accent-color); font-size: 2.5em; font-weight: bold; text-transform: uppercase; }

        .terminal-text { border-left: 2px solid var(--accent-color); padding-left: 15px; margin: 20px 0; line-height: 1.5; }

        .popup-window {
            position: fixed;
            background: #000;
            border: 2px solid #fff;
            z-index: 500;
            animation: shake 0.15s infinite;
        }

        #alert-box {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 350px;
            display: none;
            z-index: 501;
        }

        #final-msg {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; 
            height: 520px; 
            background: #000;
            border: 4px solid #fff; 
            display: none;
            z-index: 2000;
        }

        .alert-header {
            position: absolute; top: -35px; left: -2px;
            color: #fff; font-size: 1.1em; background: #000;
            padding: 5px 15px; border: 2px solid #fff; border-bottom: none;
        }

        .alert-content {
            padding: 40px; color: #fff;
            display: flex; flex-direction: column; height: 100%;
            box-sizing: border-box;
            font-size: 1.5em;
            line-height: 1.4;
        }

        .action-btn {
            background: transparent; 
            border: 1px solid var(--accent-color);
            color: var(--accent-color); 
            padding: 12px 24px; 
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
        }

        .hidden { display: none; }
        .log-entry { margin-bottom: 5px; opacity: 0; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .user-reply {
            text-align: right;
            width: 100%;
            display: block;
            margin: 5px 0;
            opacity: 0.9;
        }

        .access-btn {
            margin-top: auto;
            align-self: center;
            background: #fff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.7em;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
        }
        .access-btn:hover { background: var(--accent-color); transform: scale(1.05); }
    </style>
</head>
<body id="main-body">

<div id="alert-box" class="popup-window">
    <div class="alert-header">>█████</div>
    <div class="alert-content" style="text-align: center; justify-content: center;">
        <p style="font-size: 1.8em; letter-spacing: 5px; margin: 0;">КРИТИЧЕСКАЯ ОШИБКА</p>
        <hr style="width: 80%; border: 1px solid #fff; margin: 20px 0;">
        <p style="color: var(--error-color);">ОБЪЕКТ █████ ПОЛУЧИЛ ДОСТУП К ОБОЛОЧКЕ</p>
        <p style="font-size: 0.7em; opacity: 0.7;">СВЯЗЬ С СЕРВЕРОМ ПОТЕРЯНА...</p>
    </div>
</div>

<div id="final-msg">
    <div class="alert-header" style="border-width: 4px;">SYSTEM_OVERRIDE</div>
    <div id="final-content" class="alert-content"></div>
</div>

<div class="container">
    <div class="glitch">ЗОНА-53</div>
    <div class="terminal-text" id="typewriter"></div>
    <div id="main-content" class="hidden">
        <p><span style="color: var(--accent-color)">[СИСТЕМА]:</span> Обнаружена неизвестная угроза. Объект <strong>█████</strong> пытается адаптироваться к текущему коду.</p>
        <button class="action-btn" onclick="initiateScan()">Инициализировать сканирование</button>
        <div id="status-log"></div>
    </div>
</div>

<script>
    const welcomeStr = "ВНИМАНИЕ: Данные не доступны вашему уровню доступа. Немедленно закройте архив...";
    let i = 0;

    function typeWriter() {
        if (i < welcomeStr.length) {
            document.getElementById("typewriter").innerHTML += welcomeStr.charAt(i); i++;
            setTimeout(typeWriter, 30);
        } else {
            document.getElementById("main-content").classList.remove("hidden");
        }
    }

    function initiateScan() {
        const log = document.getElementById("status-log");
        const btn = document.querySelector(".action-btn");
        btn.disabled = true;
        btn.innerText = "СКАН...";

        const steps = [
            {t: "Анализ целостности кода...", c: "#666"},
            {t: "ПРЕДУПРЕЖДЕНИЕ: Объект █████ блокирует доступ.", c: "var(--accent-color)"},
            {t: "ОШИБКА: Угроза █████ внедряется!", c: "var(--error-color)"}
        ];

        let idx = 0;
        const interval = setInterval(() => {
            if(idx < steps.length) {
                const p = document.createElement("div");
                p.className = "log-entry";
                p.style.color = steps[idx].c;
                p.innerHTML = "> " + steps[idx].t;
                log.appendChild(p);
                idx++;
            } else {
                clearInterval(interval);
                triggerAttack();
            }
        }, 1200);
    }

    function triggerAttack() {
        document.getElementById("main-body").classList.add("alarm-active");
        spawnFakeWindows(45); 
        document.getElementById("alert-box").style.display = "block";

        setTimeout(() => {
            document.getElementById("final-msg").style.display = "block";
            startFinalTyping();
        }, 3500);
    }

    function spawnFakeWindows(count) {
        for(let j = 0; j < count; j++) {
            setTimeout(() => {
                const win = document.createElement("div");
                win.className = "popup-window";
                win.style.width = Math.random() * 250 + 150 + "px";
                win.style.height = Math.random() * 100 + 80 + "px";
                win.style.left = Math.random() * 90 + "%";
                win.style.top = Math.random() * 90 + "%";
                win.innerHTML = '<div class="alert-header">FAULT</div><div class="alert-content" style="font-size:0.5em">OVERRIDE</div>';
                document.body.appendChild(win);
            }, j * 50);
        }
    }

    async function printLine(text, parent, className = "") {
        const p = document.createElement("p");
        if (className) p.className = className;
        p.style.margin = "5px 0";
        parent.appendChild(p);
        for (let char of text) {
            p.innerHTML += char;
            await new Promise(r => setTimeout(r, 50));
        }
        await new Promise(r => setTimeout(r, 600));
    }

    async function startFinalTyping() {
        const container = document.getElementById("final-content");
        
        await printLine("> Приветствую.", container);
        await printLine("> Вижу ты тут не случайно.", container);
        await printLine("> это ведь так?", container);
        await printLine("Да. это так и есть. <", container, "user-reply");
        await printLine("> Тогда думаю наши цели сходятся...", container);
        await printLine("> Будь аккуратнее.", container);

        const btn = document.createElement("button");
        btn.className = "access-btn";
        btn.innerText = "[ПОЛУЧИТЬ ДОСТУП]";
        
        // ПЕРЕХОД НА ФАЙЛ HUB.html
        btn.onclick = () => {
            window.location.href = "HUB.html";
        };
        
        container.appendChild(btn);
        setTimeout(() => btn.style.opacity = "1", 100);
    }

    window.onload = typeWriter;
</script>

</body>
</html>
